name: Question / support
description: Ask for help using or building the app
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What do you want to know? Include what you already tried or read.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context
      placeholder: e.g. building from source on Fedora, using a specific model
