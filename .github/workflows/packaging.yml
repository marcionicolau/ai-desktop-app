name: packaging

# Tag-triggered only: v<major>.<minor>.<patch> with optional semver suffix
# (e.g. v1.2.3, v1.2.3-rc.1). Push a tag to cut a release build — the
# `release` job then publishes a GitHub Release with the zipped artifacts.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: false # a release build always runs to completion

jobs:
  # per-lane switch — flip `enabled` when a runner (and signing certs,
  # for release lanes) are arranged. Linux is the verified lane.
  # Job-level `if` can't see the `matrix` context, so the enabled lanes
  # are filtered here and fed to `package` via fromJSON.
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          matrix=$(jq -nc '{
            include: [
              {os: "ubuntu-latest",  platform: "linux-x64",    enabled: true,
               "native-script": "scripts/build-native.sh"},
              {os: "macos-latest",   platform: "darwin-arm64", enabled: false,
               "native-script": "scripts/build-native.sh"},
              {os: "windows-latest", platform: "win-x64",      enabled: false,
               "native-script": "scripts/build-native.ps1"}
            ]
          } | {include: [.include[] | select(.enabled)]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: package ${{ matrix.platform }}
    needs: lanes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lanes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install deps
        run: bun install --frozen-lockfile
      - name: project electrobun devkit
        run: bun x electrobun prepare
      # ccache, not the cmake tree — fresh checkout mtimes would rebuild every
      # object anyway; llama.cpp auto-uses ccache when present (GGML_CCACHE)
      - name: install ccache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get install -y ccache
          elif [[ "$RUNNER_OS" == "macOS" ]]; then brew install ccache
          else choco install ccache; fi
      - name: cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ matrix.platform }}-ccache-${{ hashFiles('src/native/shim/**', 'src/native/vendor/llama.cpp/CMakeLists.txt', 'scripts/build-native.sh', 'scripts/build-native.ps1', 'scripts/stage-native.ts') }}
          restore-keys: ${{ matrix.platform }}-ccache-
      - name: build native shim
        run: ${{ matrix.native-script }}
      - name: build renderer
        run: bun run build:renderer
      # prerelease tags (v1.2.3-rc.1) → canary channel; stable tags → stable
      - name: select channel
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then channel=canary; else channel=stable; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # `bun x electrobun`, not `bun run build` — hutch is a local dev tool,
      # not installed on runners
      - name: electrobun build
        env:
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: bun x electrobun build --env=${{ steps.channel.outputs.channel }}
      - name: verify artifact
        shell: bash
        run: scripts/verify-artifact.sh "build/${{ steps.channel.outputs.channel }}-${{ matrix.platform }}"
      # upload the build/ wrapper so the artifact keeps its
      # <channel>-<platform>/ dir — release job zips are named from it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: causerie-${{ steps.channel.outputs.channel }}-${{ matrix.platform }}
          path: build/
          retention-days: 14
      # feature 013: update manifests + bundles emitted by electrobun build
      # (artifacts/ at repo root) — forwarded to the rolling `feed` release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('artifacts/*-update*.json') != ''
        with:
          name: update-feed-${{ steps.channel.outputs.channel }}-${{ matrix.platform }}
          path: artifacts/
          retention-days: 14

  release:
    name: github release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    steps:
      # checkout must precede "create release": gh resolves repo context
      # (and --generate-notes) via local git — without it gh fails with
      # "failed to run git: not a git repository"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0 # needed for notes git log
      # merge-multiple: a single matched artifact extracts flat into dist/
      # (v8 quirk) while >=2 get per-name subdirs — merge keeps the layout
      # stable at any lane count; filenames are channel+platform-scoped
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: causerie-*
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for d in dist/*/; do
            (cd "$d" && zip -qr "../causerie-$(basename "$d").zip" .)
          done
          args=(--generate-notes --title "${GITHUB_REF_NAME}")
          [[ "${GITHUB_REF_NAME}" == *-* ]] && args+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" dist/*.zip "${args[@]}"

      # feature 013: publish update manifests/bundles + notes sidecars to
      # the rolling `feed` release — the channel-scoped baseUrl clients
      # poll (contracts/feed.md). Assets are clobbered per channel+platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-feed-*
          path: feed-src
          merge-multiple: true # lanes land flat in feed-src/ — manifest & bundle names are channel+platform-scoped, no collisions
      - name: publish update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # notes sidecar per channel+platform manifest found in feed-src/
          channel=canary; [[ "${GITHUB_REF_NAME}" != *-* ]] && channel=stable
          prev=$(git tag -l "v*-*" --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          [ "$channel" = "stable" ] && prev=$(git tag -l "v*" --exclude="*-*" --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          for mf in feed-src/*-update-v2.json; do
            prefix=$(basename "$mf" -update-v2.json)
            {
              echo "date: $(date +%F)"
              git log "${prev:+$prev..}${GITHUB_REF_NAME}" --pretty=format:'- %s' | head -30
            } > "feed-src/${prefix}-notes.md"
          done
          # feed-src/ can legitimately be empty (electrobun emitted no
          # *-update*.json) — uploading nothing makes gh fail with
          # "requires at least 2 arg(s)"
          files=(feed-src/*)
          if ((${#files[@]})); then
            gh release view feed >/dev/null 2>&1 || \
              gh release create feed --title "Update feed" --prerelease --notes "Rolling auto-update manifests and bundles — do not tag commits."
            gh release upload feed "${files[@]}" --clobber
          else
            echo "no update artifacts produced this run — skipping feed publish"
          fi
