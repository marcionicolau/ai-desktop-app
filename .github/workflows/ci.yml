name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # vendored llama.cpp lives in a submodule
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-cache: true
      - name: install deps
        run: bun install --frozen-lockfile
      - name: project electrobun devkit
        run: bun x electrobun prepare
      - name: cache native build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/build/linux-x64
          key: linux-x64-native-${{ hashFiles('src/native/shim/**', 'src/native/vendor/llama.cpp/CMakeLists.txt', 'scripts/build-native.sh', 'scripts/stage-native.ts') }}
          restore-keys: linux-x64-native-
      # gguf-meta/scanModels/engine tests call the shim over bun:ffi
      - name: build native shim
        run: scripts/build-native.sh
      - name: cache test model
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/SmolLM2-135M-Instruct-Q4_K_M.gguf
          key: model-smollm2-135m-instruct-q4km-v1
      - name: download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 3 -o models/SmolLM2-135M-Instruct-Q4_K_M.gguf \
            https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf
      - name: typecheck
        run: bun run typecheck
      - name: lint
        run: bun run lint
      - name: test
        run: bun test ./tests
