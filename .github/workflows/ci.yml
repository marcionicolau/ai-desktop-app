name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-cache: true
      - name: install deps
        run: bun install --frozen-lockfile
      - name: project electrobun devkit
        run: bun x electrobun prepare
      - name: typecheck
        run: bun run typecheck
      - name: lint
        run: bun run lint
      # FFI suites self-skip without a GGUF model — safe without the shim
      - name: test
        run: bun test ./tests
